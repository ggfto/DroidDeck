<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DroidDeck — seu deck de botões para o PC.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0D0D0F">
  <meta name="apple-mobile-web-app-title" content="DroidDeck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DroidDeck</title>
  <link rel="manifest" href="manifest.json">
  <!-- Fundo escuro antes do Flutter carregar: sem clarão branco. -->
  <style>html, body { background: #0D0D0F; margin: 0; }</style>

  <script>
    // Configurador é servido localmente pelo backend: sem service worker.
    // Desregistra qualquer SW antigo (e apaga o cache dele) pra nunca servir versão velha.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      }
    }
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Sem service worker (não passamos a opção serviceWorker de propósito).
      // O PC troca o carimbo abaixo a cada build e serve /v/<carimbo>/ como a raiz: o
      // navegador baixa JS e fonte de ícones novos juntos, sem misturar com o cache velho.
      var build = '__WEB_BUILD__';
      var base = build.charAt(0) === '_' ? '' : 'v/' + build + '/';
      _flutter.loader.loadEntrypoint({
        entrypointUrl: base + 'main.dart.js',
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({ assetBase: base }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
