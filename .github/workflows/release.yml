name: Release

# Disparo MANUAL (Actions -> Release -> Run workflow). O semantic-release decide a
# versão a partir dos commits (feat -> minor, fix -> patch, BREAKING -> major),
# gera o CHANGELOG, cria a tag + a Release e anexa o backend (.zip) e o app (.apk).
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  backend:
    name: Backend (Windows .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build do configurador web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained (win-x64)
        run: dotnet publish RaspDeck/DroidDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - name: Embute o web no publish (wwwroot ao lado do exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/wwwroot | Out-Null
          Copy-Item app/build/web/* publish/wwwroot -Recurse -Force

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath DroidDeck-win-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: backend
          path: DroidDeck-win-x64.zip

  app:
    name: App (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaura assinatura de release (se os secrets existirem)
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
            echo "Assinatura: chave de release"
          else
            echo "Assinatura: debug (sem secrets)"
          fi

      - name: Build do APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renomeia o APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk DroidDeck.apk

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: DroidDeck.apk

  release:
    name: semantic-release
    needs: [backend, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # semantic-release precisa do histórico + tags

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Instala o semantic-release
        run: npm install

      - uses: actions/download-artifact@v8
        with:
          name: backend
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: app
          path: dist

      - name: semantic-release (decide versão, cria tag/release, anexa binários)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
