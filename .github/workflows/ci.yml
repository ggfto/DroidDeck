name: CI

# Testes do backend, analyzer + testes do app e build estrito da documentação, a cada push
# na main e em todo pull request. A Release continua manual (release.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (dotnet test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Os testes de teclado (SendInput + hook) precisam de desktop interativo, que o runner
      # pode não ter: rodam só localmente.
      - name: Testes
        run: dotnet test DroidDeck.sln -c Release --filter "Category!=RequiresDesktop"

  app:
    name: App (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Erros e warnings derrubam o build; os "info" (estilo) não.
      - name: Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt

      - run: pip install -r website/requirements.txt

      - name: Build
        working-directory: website
        run: mkdocs build --strict
